<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Aplikasi absensi madrasah — scan QR, rekap, dan pengelolaan data siswa.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Absensi Madrasah">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Absensi Madrasah</title>
  <link rel="manifest" href="manifest.json">

  <!-- Beep + vibrate feedback (dipanggil saka Dart via JS interop) -->
  <script>
    function madrasahBeep(success) {
      try {
        if (navigator.vibrate) {
          navigator.vibrate(success ? 120 : [200, 100, 200]);
        }
      } catch (e) {}
      try {
        var ctx = new (window.AudioContext || window.webkitAudioContext)();
        var osc = ctx.createOscillator();
        var gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.type = success ? 'sine' : 'square';
        osc.frequency.value = success ? 880 : 220;
        gain.gain.setValueAtTime(0.25, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.18);
        osc.start();
        osc.stop(ctx.currentTime + 0.2);
      } catch (e) {}
    }
  </script>
</head>
<body style="margin:0; background:#F8FAFC;">
  <!--
    Splash loading: katon nalika engine Flutter isih dimuat (mungkin 1-5 detik
    ing koneksi alon). Ilang otomatis nalika first frame app render; yen 25s
    durung render (engine gagal) → pesen kesalahan.
  -->
  <div id="loading" style="position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px; background:#F8FAFC; z-index:9999; font-family:system-ui, -apple-system, sans-serif;">
    <div style="width:44px; height:44px; border:4px solid #DCE9F7; border-top-color:#0F766E; border-radius:50%; animation:madrasahSpin 0.9s linear infinite;"></div>
    <div class="msg" style="color:#475569; font-size:14px; font-weight:600;">Memuat aplikasi…</div>
  </div>
  <style>@keyframes madrasahSpin { to { transform: rotate(360deg); } }</style>
  <script>
    (function () {
      function hideLoading() {
        var el = document.getElementById('loading');
        if (el) { el.style.display = 'none'; }
      }
      window.addEventListener('flutter-first-frame', hideLoading);
      // Fallback: engine gagal dimuat → pesen sing jelas, ora spinner selawase
      setTimeout(function () {
        var el = document.getElementById('loading');
        if (el && el.style.display !== 'none') {
          el.querySelector('.msg').textContent =
            'Tidak dapat memuat aplikasi. Periksa koneksi, lalu refresh halaman.';
        }
      }, 25000);
    })();
  </script>
  <!--
    Dev: unregister service worker lawas supaya versi anyar langsung muncul
    (tanpa iki, browser nyimpen versi lawas sing wis ke-cache).
  -->
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function (regs) {
        regs.forEach(function (r) { r.unregister(); });
      });
    }
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
