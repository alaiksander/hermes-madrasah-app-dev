<!-- Flash message banner.
     Di-render kalau URL punya query ?msg=&type= -->
{% set msg = request.query_params.get("msg") %}
{% set msg_type = request.query_params.get("type", "success") %}
{% if msg %}
<div class="mb-4 rounded-lg px-4 py-3 text-sm flex items-center justify-between
            {% if msg_type == 'error' %}bg-red-50 border border-red-200 text-red-700
            {% elif msg_type == 'warning' %}bg-amber-50 border border-amber-200 text-amber-700
            {% else %}bg-green-50 border border-green-200 text-green-700{% endif %}"
     x-data="{ open: true }" x-show="open">
    <div class="flex items-center gap-2">
        <i data-lucide="{% if msg_type == 'error' %}alert-circle{% elif msg_type == 'warning' %}alert-triangle{% else %}check-circle{% endif %}" class="w-4 h-4"></i>
        <span>{{ msg }}</span>
    </div>
    <button type="button" onclick="this.parentElement.remove()" class="text-current opacity-60 hover:opacity-100">
        <i data-lucide="x" class="w-4 h-4"></i>
    </button>
</div>
{% endif %}
