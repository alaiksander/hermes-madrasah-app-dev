<!-- Sidebar — di-include dari base.html.
     Menu modul aktif + identitas user + tombol logout.
     Akan diperluas di Task 1.3 dengan menu lengkap. -->
<aside class="w-56 bg-white border-r border-zinc-200 flex flex-col">
    <div class="p-4 border-b border-zinc-200">
        <a href="/madrasah-app/" class="flex items-center gap-2 text-zinc-900">
            <i data-lucide="graduation-cap" class="w-5 h-5 text-teal-700"></i>
            <span class="font-semibold">Madrasah</span>
        </a>
    </div>
    <nav class="flex-1 p-3 space-y-1 text-sm">
        {% block sidebar_menu %}
        <!-- Menu per-modul di-inject via router include -->
        {% endblock %}
    </nav>
    <div class="p-3 border-t border-zinc-200">
        <a href="/madrasah/" class="flex items-center gap-2 text-xs text-zinc-500 hover:text-zinc-700 mb-2">
            <i data-lucide="smartphone" class="w-4 h-4"></i> Buka di HP
        </a>
        <form method="post" action="/madrasah-app/logout">
            <button type="submit" class="flex items-center gap-2 text-xs text-zinc-500 hover:text-red-600 w-full">
                <i data-lucide="log-out" class="w-4 h-4"></i> Keluar
            </button>
        </form>
    </div>
</aside>
