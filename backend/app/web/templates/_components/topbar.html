<!-- Topbar — identitas user + tenant.
     Akan diperluas di Task 1.3 dengan breadcrumbs. -->
<header class="bg-white border-b border-zinc-200 px-4 md:px-6 py-3 flex items-center justify-between gap-3">
    <div class="flex items-center gap-2 min-w-0">
        <button type="button"
                id="sidebar-mobile-toggle"
                onclick="openSidebarMobile()"
                class="lg:hidden p-2 -ml-1 rounded-lg hover:bg-zinc-100 text-zinc-600"
                title="Buka menu"
                aria-label="Buka menu">
            <i data-lucide="menu" class="w-5 h-5"></i>
        </button>
        <div class="text-sm text-zinc-500 truncate">
            {% block topbar_title %}Dashboard{% endblock %}
        </div>
    </div>
    <div class="flex items-center gap-3 text-sm">
        {% if user %}
        <div class="text-right hidden sm:block">
            <div class="font-medium text-zinc-900">{{ user.nama }}</div>
            <div class="text-xs text-zinc-500">
                {% if user.role == "super_admin" %}
                <span class="inline-block px-2 py-0.5 rounded text-xs bg-purple-100 text-purple-700">Super Admin</span>
                {% elif user.role == "admin" %}
                <span class="inline-block px-2 py-0.5 rounded text-xs bg-teal-100 text-teal-700">Admin</span>
                {% else %}
                <span class="inline-block px-2 py-0.5 rounded text-xs bg-zinc-100 text-zinc-700">Guru</span>
                {% endif %}
                {% if user.tenant_kode %}· {{ user.tenant_kode }}{% endif %}
            </div>
        </div>
        <div class="w-9 h-9 rounded-full bg-teal-700 text-white flex items-center justify-center font-semibold">
            {{ user.nama[:1]|upper }}
        </div>
        {% endif %}
    </div>
</header>
