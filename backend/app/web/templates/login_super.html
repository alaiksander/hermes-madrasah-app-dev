<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Masuk Super Admin · Aplikasi Madrasah</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/madrasah-app/static/app.css">
</head>
<body class="bg-zinc-100 min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-md">
        <div class="text-center mb-6">
            <div class="inline-flex items-center justify-center w-14 h-14 bg-zinc-900 text-white rounded-2xl mb-3">
                <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21h18"/><path d="M5 21V7l8-4v18"/><path d="M19 21V11l-6-4"/></svg>
            </div>
            <h1 class="text-xl font-bold text-zinc-900">Panel Super Admin</h1>
            <p class="text-sm text-zinc-500 mt-1">Kelola seluruh madrasah di platform</p>
        </div>

        <div class="bg-white rounded-2xl shadow-sm border border-zinc-200 p-6">
            {% if error %}
            <div class="bg-red-50 border border-red-200 text-red-700 text-sm rounded-lg p-3 mb-4">
                {{ error }}
            </div>
            {% endif %}

            <form method="post" action="/madrasah-app/login-super" class="space-y-4">
                <input type="hidden" name="next" value="{{ next or '' }}">
                <div>
                    <label class="block text-sm font-medium text-zinc-700 mb-1">Username</label>
                    <input type="text" name="username" required autocomplete="username" autofocus
                           value="{{ username or '' }}"
                           class="w-full border border-zinc-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-zinc-900 focus:border-zinc-900">
                </div>
                <div>
                    <label class="block text-sm font-medium text-zinc-700 mb-1">Kata Sandi</label>
                    <input type="password" name="password" required autocomplete="current-password"
                           class="w-full border border-zinc-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-zinc-900 focus:border-zinc-900">
                </div>
                <button type="submit"
                        class="w-full bg-zinc-900 hover:bg-zinc-800 text-white font-medium rounded-lg py-2 text-sm transition">
                    Masuk Super Admin
                </button>
            </form>
        </div>

        <div class="text-center mt-4">
            <a href="/madrasah-app/login" class="text-sm text-zinc-500 hover:text-zinc-700">
                ← Kembali ke login madrasah
            </a>
        </div>
    </div>
</body>
</html>
