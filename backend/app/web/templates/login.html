{% extends "base.html" %}
{% block title %}Masuk{% endblock %}
{% block body %}
<div class="min-h-screen flex items-center justify-center bg-gradient-to-br from-zinc-50 to-zinc-100 p-4">
    <div class="w-full max-w-md">
        <div class="text-center mb-6">
            <h1 class="text-2xl font-bold text-zinc-900">Aplikasi Madrasah</h1>
            <p class="text-sm text-zinc-500 mt-1">Panel administrasi madrasah</p>
        </div>
        <div class="bg-white rounded-2xl shadow-lg p-6 sm:p-8">
            <h2 class="text-lg font-semibold mb-4">Masuk</h2>
            {% if error %}
            <div class="bg-red-50 border border-red-200 text-red-700 text-sm rounded-lg p-3 mb-4">
                {{ error }}
            </div>
            {% endif %}
            <form method="post" action="/madrasah-app/login" class="space-y-4">
                <input type="hidden" name="next" value="{{ next or '' }}">
                <div>
                    <label for="kode" class="block text-sm font-medium text-zinc-700 mb-1">Kode Madrasah</label>
                    <input type="text" id="kode" name="kode" required autocomplete="username"
                           value="{{ kode or '' }}"
                           placeholder="contoh: mtsn2kudus"
                           class="w-full border border-zinc-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-teal-500 focus:border-teal-500">
                </div>
                <div>
                    <label for="username" class="block text-sm font-medium text-zinc-700 mb-1">Username</label>
                    <input type="text" id="username" name="username" required autocomplete="username"
                           value="{{ username or '' }}"
                           class="w-full border border-zinc-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-teal-500 focus:border-teal-500">
                </div>
                <div>
                    <label for="password" class="block text-sm font-medium text-zinc-700 mb-1">Kata Sandi</label>
                    <input type="password" id="password" name="password" required autocomplete="current-password"
                           class="w-full border border-zinc-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-teal-500 focus:border-teal-500">
                </div>
                <button type="submit" class="btn btn-primary w-full justify-center py-2.5">
                    <i data-lucide="log-in" class="w-4 h-4"></i> Masuk
                </button>
            </form>
            <p class="text-xs text-zinc-500 mt-4 text-center">
                Untuk pengguna HP, gunakan
                <a href="/madrasah/" class="text-teal-600 hover:underline">aplikasi mobile</a>.
            </p>
        </div>
    </div>
</div>
{% endblock %}
