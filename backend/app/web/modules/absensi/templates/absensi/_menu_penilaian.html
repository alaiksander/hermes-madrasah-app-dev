<!-- Grup: Penilaian — expandable accordion.
     Hanya tampil kalau user punya permission penilaian.* -->
{% if has_any_perm(user, "penilaian.view", "penilaian.input", "penilaian.export") %}
<details class="sidebar-group" {% if '/penilaian' in request.url.path %}open{% endif %}>
    <summary class="sidebar-group-summary" title="Penilaian">
        <i data-lucide="clipboard-list" class="w-4 h-4 flex-shrink-0 menu-icon"></i>
        <span class="menu-text">Penilaian</span>
        <i data-lucide="chevron-right" class="sidebar-group-chevron w-3 h-3 ml-auto"></i>
    </summary>
    <div class="sidebar-group-items">
        <a href="/madrasah-app/penilaian"
           class="flex items-center gap-2 px-3 py-2 rounded-lg {% if '/penilaian' in request.url.path and '/rekap' not in request.url.path %}bg-teal-50 text-teal-700 font-medium{% else %}text-zinc-700 hover:bg-zinc-100{% endif %}"
           title="Input & daftar penilaian">
            <i data-lucide="pen-line" class="w-4 h-4 flex-shrink-0 menu-icon"></i>
            <span class="menu-text">Input Nilai</span>
        </a>
        <a href="/madrasah-app/penilaian/rekap"
           class="flex items-center gap-2 px-3 py-2 rounded-lg {% if '/rekap' in request.url.path %}bg-teal-50 text-teal-700 font-medium{% else %}text-zinc-700 hover:bg-zinc-100{% endif %}"
           title="Rekap nilai per kelas">
            <i data-lucide="table-2" class="w-4 h-4 flex-shrink-0 menu-icon"></i>
            <span class="menu-text">Rekap Nilai</span>
        </a>
    </div>
</details>
{% endif %}
