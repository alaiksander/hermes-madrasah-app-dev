<!-- Grup: Jurnal — expandable accordion (gaya: icon kiri + chevron kanan).
     Group hanya tampil kalau ada minimal satu submenu yang permission-nya aktif. -->
{% if has_any_perm(user, "jurnal.view", "jurnal.input", "jurnal.verify") %}
<details class="sidebar-group" {% if '/jurnal' in request.url.path %}open{% endif %}>
    <summary class="sidebar-group-summary" title="Jurnal Mengajar">
        <i data-lucide="book-open" class="w-4 h-4 flex-shrink-0 menu-icon"></i>
        <span class="menu-text">Jurnal</span>
        <i data-lucide="chevron-right" class="sidebar-group-chevron w-3 h-3 ml-auto"></i>
    </summary>
    <div class="sidebar-group-items">
        {% if has_perm(user, "jurnal.view") %}
        <a href="/madrasah-app/jurnal/"
           class="flex items-center gap-2 px-3 py-2 rounded-lg {% if request.url.path == '/madrasah-app/jurnal/' %}bg-teal-50 text-teal-700 font-medium{% else %}text-zinc-700 hover:bg-zinc-100{% endif %}"
           title="Dashboard Jurnal">
            <i data-lucide="layout-dashboard" class="w-4 h-4 flex-shrink-0 menu-icon"></i>
            <span class="menu-text">Dashboard</span>
        </a>
        {% endif %}
        {% if has_perm(user, "jurnal.input") %}
        <a href="/madrasah-app/jurnal/input"
           class="flex items-center gap-2 px-3 py-2 rounded-lg {% if '/jurnal/input' in request.url.path %}bg-teal-50 text-teal-700 font-medium{% else %}text-zinc-700 hover:bg-zinc-100{% endif %}"
           title="Input Jurnal">
            <i data-lucide="notebook-pen" class="w-4 h-4 flex-shrink-0 menu-icon"></i>
            <span class="menu-text">Input Jurnal</span>
        </a>
        {% endif %}
        {% if has_perm(user, "jurnal.view") %}
        <a href="/madrasah-app/jurnal/riwayat"
           class="flex items-center gap-2 px-3 py-2 rounded-lg {% if '/jurnal/riwayat' in request.url.path %}bg-teal-50 text-teal-700 font-medium{% else %}text-zinc-700 hover:bg-zinc-100{% endif %}"
           title="Riwayat Jurnal">
            <i data-lucide="history" class="w-4 h-4 flex-shrink-0 menu-icon"></i>
            <span class="menu-text">Riwayat</span>
        </a>
        {% endif %}
    </div>
</details>
{% endif %}
