<!-- Grup: Perwalian (Wali Kelas) — expandable accordion.
     Hanya tampil kalau user punya permission wali.view (atau kelas.view). -->
{% if has_any_perm(user, "wali.view", "kelas.view") %}
<details class="sidebar-group" {% if '/wali-kelas' in request.url.path %}open{% endif %}>
    <summary class="sidebar-group-summary" title="Perwalian">
        <i data-lucide="heart-handshake" class="w-4 h-4 flex-shrink-0 menu-icon"></i>
        <span class="menu-text">Perwalian</span>
        <i data-lucide="chevron-right" class="sidebar-group-chevron w-3 h-3 ml-auto"></i>
    </summary>
    <div class="sidebar-group-items">
        <a href="/madrasah-app/wali-kelas"
           class="flex items-center gap-2 px-3 py-2 rounded-lg {% if '/wali-kelas' in request.url.path %}bg-teal-50 text-teal-700 font-medium{% else %}text-zinc-700 hover:bg-zinc-100{% endif %}"
           title="Kelas Perwalian">
            <i data-lucide="users" class="w-4 h-4 flex-shrink-0 menu-icon"></i>
            <span class="menu-text">Wali Kelas</span>
        </a>
    </div>
</details>
{% endif %}
